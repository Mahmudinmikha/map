<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VB.NET Map <?php echo "Mahmudin"; ?></title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>
    // Inisialisasi map
    var map = L.map('map').setView([-6.2000, 106.8166], 13);

    // OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Data lokasi yang ingin ditandai
    var lokasi = [
        {
            nama: "Lokasi Kantor",
            latitude: -6.126667,
            longitude: 106.788611
        },
        {
            nama: "Rumah",
            latitude: -6.0928286,
            longitude: 106.4977360
        },
        {
            nama: "Lokasi Pabrik",
            latitude: -6.300000,
            longitude: 106.900000
        }
    ];

    // Menampilkan marker dari data lokasi
    lokasi.forEach(function(item) {

        L.marker([item.latitude, item.longitude])
            .addTo(map)
            .bindPopup(
                "<b>" + item.nama + "</b><br>" +
                "Latitude: " + item.latitude + "<br>" +
                "Longitude: " + item.longitude
            );

    });

    // Mengatur tampilan agar semua marker terlihat
    var bounds = L.latLngBounds(
        lokasi.map(function(item) {
            return [item.latitude, item.longitude];
        })
    );

    map.fitBounds(bounds);
</script>

</body>
</html>
